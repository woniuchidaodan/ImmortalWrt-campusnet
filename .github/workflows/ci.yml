name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          python -m campusnet --version
          python -m campusnet providers
          python -m campusnet status
          python -m campusnet wifi
          python -m campusnet wifi list
          python -m campusnet carrier

      - name: CLI smoke test (英文字符集控制台)
        # 回归锁定：GitHub 的 Windows runner 控制台是 cp1252，编不出中文和 ✔ ─ 这类字符。
        # 这里在三个平台上都强制一次，防止再出现「只在 Windows 上炸」的问题。
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python -m campusnet --version
          python -m campusnet providers
          python -m campusnet status
          python -m campusnet autostart status
          python -m campusnet wifi
          python -m campusnet wifi --help
          python -m campusnet carrier

      - name: Wi-Fi 逻辑回归（不依赖真实网卡）
        # 这条守住那个 bug：必须先切 Wi-Fi 再判联网。顺序反了测试就会红。
        run: pytest -q tests/test_wifi.py

      - name: 运营商归一化回归
        # 守住两个曾经的坑：normalize 必须幂等（campus_telecom ≠ telecom），
        # 「校园电信」的 R1=1 不能被降级成纯「电信」的 R1=0。
        run: pytest -q tests/test_carrier.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check campusnet tests || true
