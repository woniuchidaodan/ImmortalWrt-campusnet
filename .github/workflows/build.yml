name: Build campusnet IPK

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动触发
  push:
    tags:
      - 'v*'                # 推送 v* 标签时自动触发

jobs:
  build:
    name: Build for aarch64_cortex-a53
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        uses: immortalwrt/gh-action-sdk@v8
        env:
          ARCH: aarch64_cortex-a53   # WR30U / mediatek-filogic 的包架构
          PACKAGES: campusnet luci-app-campusnet   # 同时编译两个包
          V: s                       # 详细日志

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-aarch64_cortex-a53-ipk
          path: |
            bin/packages/aarch64_cortex-a53/base/*.ipk
            bin/packages/aarch64_cortex-a53/luci/*.ipk
          if-no-files-found: error
