name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          python -m campusnet --version
          python -m campusnet providers
          python -m campusnet status

      - name: CLI smoke test (英文字符集控制台)
        # 回归锁定：GitHub 的 Windows runner 控制台是 cp1252，编不出中文和 ✔ ─ 这类字符。
        # 这里在三个平台上都强制一次，防止再出现「只在 Windows 上炸」的问题。
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python -m campusnet --version
          python -m campusnet providers
          python -m campusnet status
          python -m campusnet autostart status

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check campusnet tests || true
