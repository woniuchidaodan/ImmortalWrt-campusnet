name: Build campusnet IPK (single package for all 24.10.x)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build single IPK compatible with all 24.10.x
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix Makefile tabs
        run: |
          python3 << 'PYEOF'
          import re

          path = 'package/campusnet/Makefile'
          with open(path, 'r') as f:
              content = f.read()

          def fix_block(text, block_name):
              pattern = r'(define ' + re.escape(block_name) + r'\n)(.*?)(\nendef)'
              def repl(m):
                  body = m.group(2)
                  new_body = '\n'.join(
                      '\t' + line.lstrip(' \t') if line.strip() else line
                      for line in body.split('\n')
                  )
                  return m.group(1) + new_body + m.group(3)
              return re.sub(pattern, repl, text, flags=re.DOTALL)

          content = fix_block(content, 'Build/Compile')
          content = fix_block(content, 'Package/campusnet/install')

          with open(path, 'w') as f:
              f.write(content)
          print("Makefile tabs fixed")
          PYEOF
          grep -P '^\t' package/campusnet/Makefile || echo "WARNING: no tabs"

      - name: Resolve SDK URL (24.10.0 for max compatibility)
        id: sdk
        run: |
          VERSION="24.10.0"
          ARCH_DIR="mediatek/filogic"

          SDK_URL="https://downloads.immortalwrt.org/releases/$VERSION/targets/$ARCH_DIR/"
          SDK_FILE=$(curl -sL "$SDK_URL" \
            | grep -oE 'immortalwrt-sdk-'"$VERSION"'-mediatek-filogic_[^"]*\.tar\.zst' \
            | head -1)

          if [ -z "$SDK_FILE" ]; then
            echo "错误：未找到 $VERSION 的 SDK 文件"
            curl -sL "$SDK_URL" | grep -oE 'immortalwrt-sdk-[^"]*\.tar\.zst' | head
            exit 1
          fi

          FULL_URL="${SDK_URL}${SDK_FILE}"
          echo "使用 SDK: $FULL_URL"
          echo "url=$FULL_URL" >> $GITHUB_OUTPUT

      - name: Build package
        uses: immortalwrt/gh-action-sdk@v8
        env:
          ARCH: aarch64_cortex-a53
          PACKAGES: campusnet luci-app-campusnet luci-i18n-campusnet-zh-cn
          V: s
          SDK_URL: ${{ steps.sdk.outputs.url }}

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-aarch64_cortex-a53-compat-24.10.x
          path: |
            bin/packages/aarch64_cortex-a53/base/*.ipk
            bin/packages/aarch64_cortex-a53/luci/*.ipk
          if-no-files-found: error
