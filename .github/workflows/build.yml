name: Build campusnet IPK (24.10.0, aarch64_cortex-a53)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build IPK for aarch64_cortex-a53
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libncurses-dev libssl-dev \
            zstd python3 python3-pip python3-setuptools rsync \
            unzip zlib1g-dev file wget subversion flex bison gawk \
            gettext texinfo libtool autoconf automake

      - name: Download and extract SDK 24.10.0
        run: |
          set -eux

          SDK_FILE="immortalwrt-sdk-24.10.0-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.0/targets/mediatek/filogic/${SDK_FILE}"

          echo "下载地址: $SDK_URL"
          wget -q --show-progress "$SDK_URL"

          echo "=== 下载完成，当前目录内容 ==="
          ls -la

          echo "=== 文件大小 ==="
          du -h "$SDK_FILE"

          echo "=== 开始解压 ==="
          tar -I zstd -xf "$SDK_FILE"

          echo "=== 解压完成，当前目录内容 ==="
          ls -la

          echo "=== 查找 SDK 目录 ==="
          SDK_DIR=$(find . -maxdepth 1 -type d -name "immortalwrt-sdk-*" | head -1)
          if [ -z "$SDK_DIR" ]; then
            echo "错误：找不到 immortalwrt-sdk-* 目录"
            echo "当前目录的所有子目录："
            find . -maxdepth 1 -type d
            exit 1
          fi

          echo "找到 SDK 目录: $SDK_DIR"
          mv "$SDK_DIR" sdk

          echo "=== 重命名后 ==="
          ls -la sdk/ | head -20

      - name: Update feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject campusnet packages
        run: |
          set -e
          cp -r package/campusnet sdk/package/
          cp -r package/luci-app-campusnet sdk/package/
          echo "已注入的包："
          ls sdk/package/ | grep campusnet

      - name: Configure (defconfig)
        run: |
          cd sdk
          make defconfig

      - name: Build campusnet
        run: |
          cd sdk
          make package/campusnet/compile V=s -j$(nproc)

      - name: Build luci-app-campusnet
        run: |
          cd sdk
          make package/luci-app-campusnet/compile V=s -j$(nproc)

      - name: List produced IPK files
        run: |
          echo "=== 产出的 IPK 文件 ==="
          find sdk/bin/packages/aarch64_cortex-a53 -name "*.ipk" -type f || true

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-aarch64_cortex-a53-ipk
          path: |
            sdk/bin/packages/aarch64_cortex-a53/base/*.ipk
            sdk/bin/packages/aarch64_cortex-a53/action/*.ipk
            sdk/bin/packages/aarch64_cortex-a53/luci/*.ipk
            sdk/bin/packages/aarch64_cortex-a53/*/*.ipk
          if-no-files-found: error
