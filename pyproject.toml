[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campusnet"
version = "0.1.0"
description = "Zero-dependency CLI that auto-logs-in to campus network captive portals (Dr.COM / Srun / Ruijie / Huawei eportal)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "campusnet contributors" }]
keywords = ["campus", "network", "portal", "captive-portal", "drcom", "srun", "ruijie", "eportal", "校园网", "认证"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=23"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/<you>/campusnet"
Issues = "https://github.com/<you>/campusnet/issues"

[project.scripts]
campusnet = "campusnet.cli:main"

[tool.setuptools.packages.find]
include = ["campusnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
